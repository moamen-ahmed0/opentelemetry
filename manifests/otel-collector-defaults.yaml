# yaml-language-server: $schema=none
# Reference only — NOT applied anywhere.
#
# This is the live `otel-collector` OpenTelemetryCollector CR as returned by the API server
# (`kubectl -n otel get opentelemetrycollector otel-collector -o yaml`), which merges in every
# CRD-schema default for fields our otel-collector.yaml never sets. Useful for seeing what the
# operator fills in behind the scenes, e.g. `replicas: 1`, `upgradeStrategy: automatic`, and the
# auto-injected self-monitoring `config.service.telemetry.metrics` block.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: otel
spec:
  config:
    exporters:
      debug:
        verbosity: detailed
    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    service:
      pipelines:
        metrics:
          exporters:
            - debug
          processors:
            - memory_limiter
            - batch
          receivers:
            - otlp
      # Auto-injected by the operator: the collector's own self-monitoring metrics,
      # not something we asked for in otel-collector.yaml.
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
  configVersions: 3
  daemonSetUpdateStrategy: {}
  deploymentUpdateStrategy: {}
  httpRoute:
    enabled: false
    gateway: ""
  image: otel/opentelemetry-collector-contrib:0.158.0
  ingress:
    route: {}
  ipFamilyPolicy: SingleStack
  managementState: managed
  mode: deployment
  networkPolicy: {}
  observability:
    metrics: {}
  podDnsConfig: {}
  replicas: 1
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
  # Defaults for the optional target-allocator sidecar (unused — we never enable it).
  targetAllocator:
    allocationStrategy: consistent-hashing
    collectorNotReadyGracePeriod: 30s
    collectorTargetReloadInterval: 30s
    filterStrategy: relabel-config
    observability:
      metrics: {}
    prometheusCR:
      evaluationInterval: 30s
      podMonitorNamespaceSelector: {}
      probeNamespaceSelector: {}
      scrapeConfigNamespaceSelector: {}
      scrapeInterval: 30s
      serviceMonitorNamespaceSelector: {}
    resources: {}
  upgradeStrategy: automatic

